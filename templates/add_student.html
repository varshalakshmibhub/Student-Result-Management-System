<!DOCTYPE html>
<html>

<head>
    <title>Add Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="navbar">
        <a href="/">Home</a>
        <a href="/add_student">Add Student</a>
        <a href="/add_marks">Add Marks</a>
        <a href="/view_results">View Results</a>
    </div>

    <div class="container">

        <h1>Add Student</h1>

        <form method="POST">

            <input type="text"
                   name="usn"
                   placeholder="Enter USN"
                   required>

            <br><br>

            <input type="text"
                   name="name"
                   placeholder="Enter Student Name"
                   required>

            <br><br>

            <input type="text"
                   name="department"
                   placeholder="Enter Department"
                   required>

            <br><br>

            <input type="text"
                   name="semester"
                   placeholder="Enter Semester"
                   required>

            <br><br>

            <button type="submit">
                Add Student
            </button>

        </form>

    </div>

</body>

</html>
